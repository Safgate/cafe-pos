name: Build Android APK and Deploy
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'

      - name: Cache pub and gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml') }}

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --no-color

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  deploy:
    name: Deploy APK to server (sslip.io hostname)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check SSH deploy secrets
        id: deploy-secrets
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ] || [ -z "${{ secrets.SSH_USER }}" ] || [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download APK artifact
        if: steps.deploy-secrets.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: ./artifact

      - name: Copy APK to remote server
        if: steps.deploy-secrets.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: artifact/app-release.apk
          target: ${{ secrets.SSH_TARGET_PATH || '/var/www/html/' }}

      - name: Verify reachable URL
        if: steps.deploy-secrets.outputs.configured == 'true'
        run: |
          echo "APK uploaded. If your server public IP is ${{ secrets.SSH_HOST }}, the sslip.io URL is: https://${{ secrets.SSH_HOST }}.sslip.io/$(basename ${{ github.workspace }}/build/app/outputs/flutter-apk/app-release.apk)"
